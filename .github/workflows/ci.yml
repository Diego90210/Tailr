name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # build before test: the secret audit (SEC-06) scans .next/static
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:i18n

  docgen:
    # Pagination fixtures use the real Cambria font shipped with Windows.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/docgen/requirements.txt
      - run: pip install -r services/docgen/requirements.txt
      - run: python -m pytest -q
        working-directory: services/docgen

  # Applies supabase/migrations to the live project on main only, after both
  # test jobs pass. Skips cleanly until the two repository secrets exist.
  migrations:
    runs-on: ubuntu-latest
    needs: [web, docgen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Supabase secrets not configured yet; skipping."
            exit 0
          fi
          supabase db push --project-ref fmejwdgnqrhgkrayjpkf --password "$SUPABASE_DB_PASSWORD"
